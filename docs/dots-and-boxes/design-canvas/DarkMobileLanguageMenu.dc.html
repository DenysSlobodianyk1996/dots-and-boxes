    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&display=swap');
    :root { --wc-paper: #241c17; --wc-surface: #30261f; --wc-surface-muted: #3a2e26; --wc-surface-strong: #45372d; --wc-border: #574638; --wc-dot: #8c7663; --wc-muted: #b7a28d; --wc-ink-soft: #dccbb7; --wc-ink: #f6ebdc; --wc-accent: #f08c73; --wc-accent-hover: #f5a48f; --wc-on-accent: #241c17; --wc-secondary: #4db6a8; --wc-danger: #ff9b85; }

  </header>
  <div style="position: absolute; top: 60px; right: 8px; width: 192px; padding: 4px; border-radius: 16px; border: 1px solid var(--wc-border); background: var(--wc-surface); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);">

  </div>
</div>
