name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # deploy only when the app changes (as in teach-clock): docs, tooling and other workflows don't.
    # scripts/ is in: vite.config.ts reads the version and the privacy date from it.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*'
      - 'env.d.ts'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  # manual "Run workflow" button in the Actions tab, for forcing a deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the whole history: the version counts merges since 1.0.0 (scripts/app-version.ts, PV-5)
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # a failing type-check, lint or test blocks the deploy (CM-40)
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # the site is served from https://<owner>.github.io/<repo name>/ (`/dots-and-boxes/` after the rename)
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback for history-mode routes
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
