name: Android release

# As in teach-clock: every merge to master that changes the app builds a signed AAB, uploads it
# to Play's closed testing track (alpha) with short release notes and tags the commit with its
# version (AR-10). Merges that touch only docs, tooling or other workflows release nothing.
# A version tag (npm run release) still releases its commit by hand. Production stays manual.
# versionName/versionCode are the commit's own version (scripts/app-version.ts, AR-11).
# Secrets (written by scripts/android-release-wizard.sh): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
# Repository variable (also written by the wizard): ANDROID_PACKAGE_ID, the Play package (app.dotsandboxes).
# GitHub masks secret values in the logs; no step prints them or runs with `set -x`.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
    # only what goes into the app (teach-clock does the same); tag pushes ignore paths filters,
    # so a manual release always runs
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*'
      - 'env.d.ts'
      - 'android/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

# one release at a time, so versionCodes reach Play in order
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # a merge whose version was already released by hand (its tag exists) releases nothing
  version:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Already released?
        id: check
        run: |
          eval "$(node scripts/app-version.ts)"
          released=false
          if [ "$GITHUB_REF_TYPE" = branch ] && git rev-parse -q --verify "refs/tags/v$ANDROID_VERSION_NAME" >/dev/null; then
            released=true
            echo "::notice title=Already released::v$ANDROID_VERSION_NAME is already tagged; nothing to release."
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.released != 'true'
    runs-on: ubuntu-latest
    permissions:
      # to tag the released commit
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole history: the version counts merges since 1.0.0 (scripts/app-version.ts)
          fetch-depth: 0

      # checked first, so a missing variable fails in seconds, not after the build
      - name: Play package id
        env:
          PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
        run: |
          if [ -z "$PACKAGE_ID" ]; then
            echo "::error title=No package id::Set the repository variable ANDROID_PACKAGE_ID (app.dotsandboxes); scripts/android-release-wizard.sh does it"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # the commit's own version (1.0.<merges since 1.0.0>), the same the web app shows (PV-5);
      # on a tag push it fails before anything is built unless the tag is that version
      - name: Version of this commit
        run: node scripts/app-version.ts >> "$GITHUB_ENV"

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint-check

      - name: Test
        run: npm test

      - name: Web build (capacitor mode)
        run: npm run build:capacitor

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # the keystore lives in $RUNNER_TEMP, outside the checkout, and is deleted at the end of the job
      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; run scripts/android-release-wizard.sh"
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # before the Play upload, so the AAB is there even when that step fails
      # (the first release must be uploaded by hand: docs/store/publishing-checklist.md, step 4)
      - name: Attach the AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ env.ANDROID_VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Play's "What's new", one file per listing language (en-US default, uk, de-DE, fr-FR,
      # it-IT, es-ES; LG-21), at most 500 characters each; detailed notes go in by hand when
      # promoting to production
      - name: Release notes
        run: |
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          printf '%s' 'Improvements and fixes' > "$dir/whatsnew-en-US"
          printf '%s' 'Покращення та виправлення' > "$dir/whatsnew-uk"
          printf '%s' 'Verbesserungen und Fehlerbehebungen' > "$dir/whatsnew-de-DE"
          printf '%s' 'Améliorations et corrections' > "$dir/whatsnew-fr-FR"
          printf '%s' 'Miglioramenti e correzioni' > "$dir/whatsnew-it-IT"
          printf '%s' 'Mejoras y correcciones' > "$dir/whatsnew-es-ES"
          echo "WHATSNEW_DIR=$dir" >> "$GITHUB_ENV"

      - name: Upload to Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_ID }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.ANDROID_VERSION_NAME }}
          tracks: alpha
          status: completed
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}

      - name: Play summary
        run: echo "Uploaded $ANDROID_VERSION_NAME (versionCode $ANDROID_VERSION_CODE) to Play track \`alpha\` (closed testing)." >> "$GITHUB_STEP_SUMMARY"

      # a merge release marks its commit as released, as npm run release does; the tag pushed with
      # GITHUB_TOKEN starts no workflow, so this commit isn't built twice
      - name: Tag the released commit
        if: github.ref_type == 'branch'
        run: |
          tag="v$ANDROID_VERSION_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" --message "Release $ANDROID_VERSION_NAME"
          git push origin "$tag"

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
